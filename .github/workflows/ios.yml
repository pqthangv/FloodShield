name: iOS build

# Builds the iPhone app on GitHub's macOS machines (free for public repositories), so the iOS
# version can be developed without a Mac. Unsigned and for the simulator: it proves the app
# compiles; signed TestFlight builds come later (Apple Developer account needed).
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/ios.yml']
  workflow_dispatch:

jobs:
  ios:
    name: iOS (simulator, unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: mobile
      - name: Install CocoaPods dependencies
        working-directory: mobile/ios
        run: bundle exec pod install
      - name: Build (Release, so the JavaScript bundle is built too)
        working-directory: mobile/ios
        run: |
          set -o pipefail
          xcodebuild -workspace FloodShield.xcworkspace -scheme FloodShield -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 \
            | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Keep the full build log and Podfile.lock
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-build
          path: |
            mobile/ios/build.log
            mobile/ios/Podfile.lock
          if-no-files-found: ignore
