# Hourly rain warnings by push notification (scripts/rain_push.py).
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   FLOODSHIELD_API  e.g. https://floodshield-api-ese8.onrender.com/api/v1
#   PUSH_JOB_TOKEN   the server's PUSH_JOB_TOKEN (Render -> Environment), not ADMIN_TOKEN
# GitHub runs scheduled jobs only from the default branch (main), sometimes a few minutes late.
name: Rain push

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: rain-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/rain_push.py
        env:
          FLOODSHIELD_API: ${{ secrets.FLOODSHIELD_API }}
          PUSH_JOB_TOKEN: ${{ secrets.PUSH_JOB_TOKEN }}
