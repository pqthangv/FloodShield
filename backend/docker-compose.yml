# Production-like local setup: the API plus a PostgreSQL database.
#   docker compose up --build
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql+asyncpg://floodshield:floodshield@db:5432/floodshield
    depends_on:
      - db

  db:
    image: postgres:17
    environment:
      - POSTGRES_USER=floodshield
      - POSTGRES_PASSWORD=floodshield
      - POSTGRES_DB=floodshield
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
