# Codemagic (codemagic.io): builds the iPhone app on a Mac, signs it with your Apple account and
# uploads it to TestFlight. Started by hand (Codemagic > Start new build), to save free minutes.
#
# Before the first build (see the iOS publishing guide):
#   1. In Codemagic: Team settings > Integrations > App Store Connect, add your API key and name it
#      exactly "FloodShield App Store Connect".
#   2. Replace APP_STORE_APPLE_ID below with the app's Apple ID number
#      (App Store Connect > your app > App Information > Apple ID).
workflows:
  ios-testflight:
    name: iOS to TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: mobile
    integrations:
      app_store_connect: FloodShield App Store Connect
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.floodshield.app
      vars:
        XCODE_WORKSPACE: FloodShield.xcworkspace
        XCODE_SCHEME: FloodShield
        APP_STORE_APPLE_ID: 0000000000 # REPLACE with the app's Apple ID number
      node: 24
      xcode: latest
    scripts:
      - name: Install npm packages
        script: npm ci
      - name: Install CocoaPods dependencies (same versions as Podfile.lock)
        script: |
          bundle install
          cd ios && bundle exec pod install
      - name: Use the signing profiles Codemagic fetched
        script: xcode-project use-profiles --project ios/FloodShield.xcodeproj
      - name: Build number = last TestFlight build + 1 (Apple refuses repeated numbers)
        script: |
          cd ios
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $((LATEST + 1))
      - name: Build the signed .ipa
        script: |
          xcode-project build-ipa \
            --workspace "ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
