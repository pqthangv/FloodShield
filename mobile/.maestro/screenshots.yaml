# Photographs the main screens of FloodShield in the iPhone simulator (App Store screenshots).
# .github/workflows/ios.yml runs it once per language, passing that language's texts:
#   maestro test --test-output-dir DIR .maestro/screenshots.yaml -e LANGUAGE="Tiếng Việt" -e SUNRISE="Bình minh" ...
# Screenshots land in DIR/<run>/<flow>/takeScreenshot/ (Maestro allows no other place).
# Before each screenshot it waits for a text that only appears once that screen has loaded.
appId: com.floodshield.app
---
- setLocation:
    latitude: 16.4637
    longitude: 107.5909
- launchApp:
    clearState: true
    permissions:
      all: allow
# Notifications can't always be pre-allowed in the simulator: answer iOS's question if it shows.
- tapOn:
    text: Allow
    optional: true

# The app starts in the phone's language (English here): choose the language like a user would.
- extendedWaitUntil:
    visible: Settings
    timeout: 120000
- tapOn: Settings
- tapOn: ${LANGUAGE}
- launchApp        # restarts; the app remembers the language

- extendedWaitUntil:
    visible: ${SUNRISE}
    timeout: 120000
- tapOn:
    text: Allow
    optional: true
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 1-home

- scrollUntilVisible:
    element: ${NEARBY_SHELTERS}
    direction: DOWN
- tapOn: ${NEARBY_SHELTERS}
# The phone asks OpenStreetMap itself, which can be slow when its servers are busy.
- extendedWaitUntil:
    visible: ${DIRECTIONS}
    timeout: 150000
    optional: true
- takeScreenshot: 2-shelters

# Forecast tab: the alerts, then one alert's details.
- launchApp
- extendedWaitUntil:
    visible: ${SUNRISE}
    timeout: 120000
- tapOn: "${TAB_FORECAST}, tab, 2 of 4"
- tapOn: "${TAB_ALERTS}.*"
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 3-alerts
- tapOn: ${DETAILS}
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 4-alert-detail

# Forecast tab again: the river chart, scrolled into view.
- launchApp
- extendedWaitUntil:
    visible: ${SUNRISE}
    timeout: 120000
- tapOn: "${TAB_FORECAST}, tab, 2 of 4"
- tapOn: ${TAB_RIVER}
- extendedWaitUntil:
    visible: ".*m³/s.*"
    timeout: 60000
    optional: true
- scroll
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 5-river

- tapOn: "${TAB_SKILLS}, tab, 3 of 4"
- extendedWaitUntil:
    visible: ${SKILLS_TITLE}
    timeout: 30000
- takeScreenshot: 6-skills

- tapOn: "${TAB_COMMUNITY}, tab, 4 of 4"
- extendedWaitUntil:
    visible: ${COMMUNITY_TITLE}
    timeout: 60000
    optional: true
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 7-community
