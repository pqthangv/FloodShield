# Render Blueprint for the FloodShield API (backend/Dockerfile).
#
# 1. Create a free PostgreSQL database on https://neon.tech (region: AWS Asia Pacific, Singapore)
#    and copy its connection string (postgresql://...?sslmode=require...). Paste it as is.
# 2. On https://render.com: New -> Blueprint -> pick this repository -> fill in DATABASE_URL and
#    CONTACT_EMAIL -> Apply.
# 3. When the service is "Live", open https://<service>.onrender.com/api/v1/thientai/
#    It must list 7 disaster types; that proves the database connection works.
#
# ADMIN_TOKEN is generated by Render: read it under the service's Environment tab.
# Free instances sleep after 15 minutes without traffic; the first request then takes up to a minute.
services:
  - type: web
    name: floodshield-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    # Only changes to the API trigger a new deploy.
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
